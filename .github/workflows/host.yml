name: "🖥️ Host · Cross-platform"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the packages
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      version:
        description: Version embedded in the packages
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: controller-${{ github.workflow }}-${{ inputs.version || github.ref }}
  cancel-in-progress: true

jobs:
  test-build-package:
    name: "🖥️ Host · ${{ matrix.target }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: Linux-x64
            windows: false
          - runner: ubuntu-24.04-arm
            target: Linux-ARM64
            windows: false
          - runner: windows-2025
            target: Windows-x64
            windows: true
          - runner: macos-15-intel
            target: macOS-Intel
            windows: false
          - runner: macos-15
            target: macOS-Apple-Silicon
            windows: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
      FORCE_COLOR: "1"
      PCCONTROLLER_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}', github.run_number) }}
      TZ: UTC

    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "🧰 Select native Windows C compiler"
        if: matrix.windows
        shell: pwsh
        run: |
          $mingwBin = "C:\mingw64\bin"
          $gcc = Join-Path $mingwBin "gcc.exe"
          if (-not (Test-Path -LiteralPath $gcc -PathType Leaf)) {
            throw "The GitHub Windows image is missing its standalone MinGW64 compiler: $gcc"
          }
          $target = (& $gcc -dumpmachine).Trim()
          if ($target -ne "x86_64-w64-mingw32") {
            throw "Expected x86_64-w64-mingw32 GCC, found $target"
          }
          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $gcc --version

      - name: "🐹 Install Go from go.mod"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: Tools/Controller/go.mod
          cache-dependency-path: Tools/Controller/go.sum

      - name: "📌 Pin selected Windows Go toolchain first on PATH"
        if: matrix.windows
        shell: pwsh
        run: |
          $goRoot = go env GOROOT
          $goBin = Join-Path $goRoot "bin"
          $goBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $goBin "go.exe") version

      - name: "🟢 Install Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: "🕰️ Freeze reproducible build time"
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: "🪟 Install Win32 resource tool"
        if: matrix.windows
        shell: pwsh
        run: |
          go version
          $requiredGo = (Select-String -Path "Tools/Controller/go.mod" -Pattern '^go\s+(.+)$').Matches.Groups[1].Value
          $actualGo = (go env GOVERSION) -replace '^go', ''
          if ($actualGo -ne $requiredGo) {
            throw "Expected Go $requiredGo from go.mod, found $actualGo"
          }
          go install github.com/tc-hib/go-winres@v0.3.3

      - name: "🚀 Build Unix package"
        if: ${{ !matrix.windows }}
        shell: bash
        run: ./build.sh --host-only --clean --version "$PCCONTROLLER_VERSION"

      - name: "🚀 Build Windows package"
        if: matrix.windows
        shell: cmd
        run: build.cmd --host-only --clean --no-upx --version %PCCONTROLLER_VERSION%

      - name: "📦 Create Host package"
        id: package
        run: >-
          node .github/scripts/package-directory.mjs
          Tools/Controller/bin
          PCController-Host
          ${{ matrix.target }}

      - name: "⬆️ Upload Host artifact"
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PCController-Host-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
          compression-level: 0

  summary:
    name: "📋 Host · Codebase summary"
    if: ${{ always() }}
    needs: test-build-package
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "🟢 Install Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: "🔎 Capture Host results"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-summary
          printf '{"total_count":0,"jobs":[]}\n' > build-summary/jobs.json
          printf '{"total_count":0,"artifacts":[]}\n' > build-summary/artifacts.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" \
            > build-summary/jobs.response.json
          mv build-summary/jobs.response.json build-summary/jobs.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > build-summary/artifacts.response.json
          mv build-summary/artifacts.response.json build-summary/artifacts.json

      - name: "⬇️ Download available Host artifacts"
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: PCController-Host-*
          path: build-summary/packages
          merge-multiple: true

      - name: "✨ Publish Host summary"
        if: ${{ always() }}
        run: >-
          node .github/scripts/codebase-summary.mjs
          host
          build-summary/jobs.json
          build-summary/artifacts.json
          build-summary/packages
