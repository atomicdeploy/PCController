name: "🖥️ Host · Cross-platform"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the packages
        required: false
        default: ""
        type: string
      firmware_artifact_name:
        description: Optional same-run firmware artifact to embed in every host target
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      version:
        description: Version embedded in the packages
        required: false
        default: ""
        type: string
      firmware_artifact_name:
        description: Exact same-run firmware artifact to embed in every host target
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: controller-${{ github.workflow }}-${{ inputs.version || github.ref }}
  cancel-in-progress: true

jobs:
  test-build-package:
    name: "🖥️ Host · ${{ matrix.target }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: Linux-x64
            windows: false
          - runner: ubuntu-24.04-arm
            target: Linux-ARM64
            windows: false
          - runner: windows-2025
            target: Windows-x64
            windows: true
          - runner: macos-15-intel
            target: macOS-Intel
            windows: false
          - runner: macos-15
            target: macOS-Apple-Silicon
            windows: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
      FORCE_COLOR: "1"
      PCCONTROLLER_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}', github.run_number) }}
      TZ: UTC

    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "🔐 Read exact host dependency lock"
        id: host-dependencies
        shell: bash
        run: node Tools/Dependencies/export-lock.mjs export-host --output "$GITHUB_OUTPUT"

      - name: "🧰 Install checksum-verified Windows C compiler"
        if: matrix.windows
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'pccontroller-winlibs.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'pccontroller-winlibs'
          curl.exe --fail --silent --show-error --location --proto '=https' --proto-redir '=https' `
            '${{ steps.host-dependencies.outputs.windows_c_compiler_url }}' --output $archive
          if ($LASTEXITCODE -ne 0) { throw "Windows compiler download failed with exit code $LASTEXITCODE" }
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = '${{ steps.host-dependencies.outputs.windows_c_compiler_sha256 }}'
          if ($actualHash -ne $expectedHash) { throw "Windows compiler SHA-256 mismatch: expected $expectedHash, found $actualHash" }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $gcc = Get-ChildItem -LiteralPath $destination -Recurse -File -Filter gcc.exe |
            Where-Object { $_.FullName -match '[\\/]mingw64[\\/]bin[\\/]gcc\.exe$' } |
            Select-Object -First 1
          if (-not $gcc) { throw 'Verified Windows compiler archive contains no mingw64/bin/gcc.exe' }
          $target = (& $gcc.FullName -dumpmachine).Trim()
          $version = (& $gcc.FullName -dumpfullversion -dumpversion).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Verified Windows compiler probe failed with exit code $LASTEXITCODE" }
          $expectedTarget = '${{ steps.host-dependencies.outputs.windows_c_compiler_target }}'
          $expectedVersion = '${{ steps.host-dependencies.outputs.windows_c_compiler_gcc_version }}'
          if ($target -ne $expectedTarget) { throw "Windows compiler target mismatch: expected $expectedTarget, found $target" }
          if ($version -ne $expectedVersion) { throw "Windows compiler version mismatch: expected $expectedVersion, found $version" }
          $gcc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$($gcc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $gcc.FullName --version

      - name: "📦 Install checksum-verified UPX"
        if: matrix.windows
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'pccontroller-upx.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'pccontroller-upx'
          curl.exe --fail --silent --show-error --location --proto '=https' --proto-redir '=https' `
            '${{ steps.host-dependencies.outputs.upx_windows_url }}' --output $archive
          if ($LASTEXITCODE -ne 0) { throw "UPX download failed with exit code $LASTEXITCODE" }
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = '${{ steps.host-dependencies.outputs.upx_windows_sha256 }}'
          if ($actualHash -ne $expectedHash) { throw "UPX SHA-256 mismatch: expected $expectedHash, found $actualHash" }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $upx = Get-ChildItem -LiteralPath $destination -Recurse -File -Filter upx.exe | Select-Object -First 1
          if (-not $upx) { throw 'Verified UPX archive contains no upx.exe' }
          $version = (& $upx.FullName --version | Select-Object -First 1).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Verified UPX probe failed with exit code $LASTEXITCODE" }
          $expectedVersion = '${{ steps.host-dependencies.outputs.upx_version }}'
          if ($version -notmatch "^upx $([regex]::Escape($expectedVersion))(?:\\s|$)") {
            throw "UPX version mismatch: expected $expectedVersion, found $version"
          }
          $upx.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: "🐹 Install Go from go.mod"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: Tools/Controller/go.mod
          cache-dependency-path: Tools/Controller/go.sum

      - name: "📌 Pin selected Windows Go toolchain first on PATH"
        if: matrix.windows
        shell: bash
        run: |
          go_root="$(go env GOROOT)"
          printf '%s/bin\n' "$go_root" >> "$GITHUB_PATH"
          go version

      - name: "🟢 Install Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.host-dependencies.outputs.node_version }}

      - name: "📦 Restore locked build-tool dependencies"
        run: npm ci --prefix Tools/Build --ignore-scripts

      - name: "🧹 Clean generated host output before accepting firmware"
        shell: bash
        run: node Tools/Build/build.mjs --clean --no-color

      - name: "⬇️ Download the exact validated firmware defaults"
        if: inputs.firmware_artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.firmware_artifact_name }}
          path: .build/firmware

      - name: "🔎 Validate the downloaded firmware and EEPROM pair"
        if: inputs.firmware_artifact_name != ''
        shell: bash
        run: >-
          node .github/scripts/assert-firmware-defaults.mjs
          .build/firmware/firmware-manifest.json

      - name: "🕰️ Freeze reproducible build time"
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: "🪟 Install Win32 resource tool"
        if: matrix.windows
        shell: bash
        run: |
          go version
          required_go="$(awk '$1 == "go" { print $2; exit }' Tools/Controller/go.mod)"
          actual_go="$(go env GOVERSION)"
          actual_go="${actual_go#go}"
          test "$actual_go" = "$required_go" || {
            printf 'Expected Go %s from go.mod, found %s\n' "$required_go" "$actual_go" >&2
            exit 1
          }
          go install "${{ steps.host-dependencies.outputs.go_winres_module }}@${{ steps.host-dependencies.outputs.go_winres_version }}"

      - name: "🚀 Build and validate complete Unix package"
        if: ${{ !matrix.windows }}
        shell: bash
        run: ./build.sh --host-only --version "$PCCONTROLLER_VERSION"

      - name: "🚀 Build and validate complete Windows package"
        if: matrix.windows
        shell: cmd
        run: build.cmd --host-only --version %PCCONTROLLER_VERSION%

      - name: "🧷 Assert both defaults are embedded in the host manifest"
        if: inputs.firmware_artifact_name != ''
        shell: bash
        run: >-
          node .github/scripts/assert-host-defaults.mjs
          Tools/Controller/bin/host-manifest.json

      - name: "📦 Create Host package"
        id: package
        run: >-
          node .github/scripts/package-directory.mjs
          Tools/Controller/bin
          PCController-Host
          ${{ matrix.target }}

      - name: "⬆️ Upload Host artifact"
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PCController-Host-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
          compression-level: 0

  summary:
    name: "📋 Host · Codebase summary"
    if: ${{ always() }}
    needs: test-build-package
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "🔐 Read exact Host dependency lock"
        id: summary-host-dependencies
        shell: bash
        run: node Tools/Dependencies/export-lock.mjs export-host --output "$GITHUB_OUTPUT"

      - name: "🟢 Install Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.summary-host-dependencies.outputs.node_version }}

      - name: "🔎 Capture Host results"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-summary
          printf '{"total_count":0,"jobs":[]}\n' > build-summary/jobs.json
          printf '{"total_count":0,"artifacts":[]}\n' > build-summary/artifacts.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" \
            > build-summary/jobs.response.json
          mv build-summary/jobs.response.json build-summary/jobs.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > build-summary/artifacts.response.json
          mv build-summary/artifacts.response.json build-summary/artifacts.json

      - name: "⬇️ Download available Host artifacts"
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: PCController-Host-*
          path: build-summary/packages
          merge-multiple: true

      - name: "✨ Publish Host summary"
        if: ${{ always() }}
        run: >-
          node .github/scripts/codebase-summary.mjs
          host
          build-summary/jobs.json
          build-summary/artifacts.json
          build-summary/packages
