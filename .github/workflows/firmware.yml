name: "⚡ Firmware · AVR"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version associated with the firmware package
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      version:
        description: Version associated with the firmware package
        required: false
        default: ""
        type: string
    outputs:
      artifact_name:
        description: Exact Actions artifact containing the validated firmware and safe EEPROM pair
        value: ${{ jobs.compile-validate-package.outputs.artifact_name }}

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ inputs.version || github.ref }}
  cancel-in-progress: true

jobs:
  compile-validate-package:
    name: "⚡ AVR Firmware · ATmega328P"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.package.outputs.archive-name }}
    env:
      FORCE_COLOR: "1"
      PCCONTROLLER_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}', github.run_number) }}
      TZ: UTC

    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "🟢 Install Node.js"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: "📌 Read canonical dependency pins"
        id: pins
        run: node Tools/Dependencies/export-lock.mjs export

      - name: "🔐 Install checksum-verified Arduino CLI"
        env:
          ARDUINO_CLI_ASSET: ${{ steps.pins.outputs.arduino_cli_asset }}
          ARDUINO_CLI_SHA256: ${{ steps.pins.outputs.arduino_cli_linux_64_sha256 }}
          ARDUINO_CLI_URL: ${{ steps.pins.outputs.arduino_cli_download_url }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$ARDUINO_CLI_ASSET"
          install_dir="$RUNNER_TEMP/arduino-cli/bin"
          curl --fail --location --retry 3 --output "$archive" "$ARDUINO_CLI_URL"
          echo "$ARDUINO_CLI_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" arduino-cli
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/arduino-cli" version

      - name: "🐹 Install Go from go.mod"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: Tools/Controller/go.mod
          cache-dependency-path: Tools/Controller/go.sum

      - name: "🕰️ Freeze reproducible build time"
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: "🧩 Install latest indexed MiniCore platform"
        env:
          MINICORE_INDEX_URL: ${{ steps.pins.outputs.minicore_index_url }}
          MINICORE_PACKAGE: ${{ steps.pins.outputs.minicore_package }}
        run: |
          arduino-cli core update-index --additional-urls "$MINICORE_INDEX_URL"
          arduino-cli core install "$MINICORE_PACKAGE" --additional-urls "$MINICORE_INDEX_URL"

      - name: "📚 Install latest indexed Arduino libraries"
        env:
          ARDUINO_LIBRARIES_JSON: ${{ steps.pins.outputs.arduino_libraries_json }}
        run: >-
          node -e 'const { execFileSync } = require("node:child_process");
          for (const library of JSON.parse(process.env.ARDUINO_LIBRARIES_JSON))
          execFileSync("arduino-cli", ["lib", "install", library], { stdio: "inherit" });'

      - name: "🚀 Build and validate AVR firmware"
        run: >-
          ./build.sh
          --firmware-only
          --clean
          --version "$PCCONTROLLER_VERSION"

      - name: "Verify RF decoding stays outside the interrupt handler"
        run: node Tools/Firmware/verify-rf-deferred.mjs

      - name: "Verify linked strip output waveform"
        run: >-
          node Tools/Firmware/verify-strip-waveform.mjs
          .build/firmware/PCController.ino_atmega328p_16000000L.lst

      - name: "💾 Assert the safe 1 KiB default EEPROM image"
        run: >-
          node .github/scripts/assert-firmware-defaults.mjs
          .build/firmware/firmware-manifest.json

      - name: "🔎 Recheck Intel HEX records and boundaries"
        run: ./firmware.sh check

      - name: "📚 Record dependencies"
        run: |
          arduino-cli version > .build/firmware/dependencies.txt
          arduino-cli version --format json > .build/firmware/resolved-cli.json
          arduino-cli core list >> .build/firmware/dependencies.txt
          arduino-cli lib list >> .build/firmware/dependencies.txt
          arduino-cli core list --format json > .build/firmware/resolved-cores.json
          arduino-cli lib list --format json > .build/firmware/resolved-libraries.json
          cp Tools/Controller/toolchain-lock.json .build/firmware/declared-dependencies.json

      - name: "📦 Create firmware package"
        id: package
        env:
          PRODUCT_SLUG: ${{ steps.pins.outputs.product_slug }}
        run: >-
          node .github/scripts/package-directory.mjs
          .build/firmware
          "${PRODUCT_SLUG}-Firmware"
          AVR-ATmega328P

      - name: "⬆️ Upload firmware artifact"
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}

      - name: "🔐 Upload firmware checksum"
        id: upload-checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.package.outputs.checksum }}
          archive: false
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}

      - name: "✨ Publish AVR build summary"
        if: always() && steps.upload.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          CHECKSUM_URL: ${{ steps.upload-checksum.outputs.artifact-url }}
        run: >-
          node .github/scripts/step-summary.mjs
          firmware
          .build/firmware/firmware-manifest.json
          "${{ steps.package.outputs.archive }}"
          "$ARTIFACT_URL"
          "$ARTIFACT_DIGEST"
          Tools/Controller/toolchain-lock.json
          "${{ steps.package.outputs.package-root }}"
          "$CHECKSUM_URL"

      # Keep every shipped opt-in firmware profile inside the same immutable
      # flash/identity, SRAM, manifest, EEPROM, and Intel HEX gates as the
      # default-off artifact. This validation deliberately runs after the
      # default package is uploaded so it cannot replace the release artifact.
      - name: "🧩 Build and validate EEPROM menu-label profile"
        run: >-
          ./build.sh
          --firmware-only
          --clean
          --version "$PCCONTROLLER_VERSION"
          --firmware-feature eeprom-menu-labels

      - name: "💾 Assert the feature-profile EEPROM and manifest contract"
        run: >-
          node .github/scripts/assert-firmware-defaults.mjs
          .build/firmware/firmware-manifest.json

      - name: "🔎 Recheck feature-profile records and boundaries"
        run: ./firmware.sh check

      - name: "🔎 Resolve latest stable larger-MCU core"
        id: target-core
        run: node Tools/Dependencies/target-cores.mjs mega2560

      - name: "🧩 Install resolved larger-MCU core in the existing CLI cache"
        env:
          TARGET_CORE: ${{ steps.target-core.outputs.core }}
          TARGET_CORE_VERSION: ${{ steps.target-core.outputs.version }}
        run: |
          node -e 'const { execFileSync } = require("node:child_process");
          const target = require("./Tools/Firmware/targets.json").mega2560;
          execFileSync("arduino-cli", ["core", "update-index", "--additional-urls", target.index], { stdio: "inherit" });
          execFileSync("arduino-cli", ["core", "install", process.env.TARGET_CORE + "@" + process.env.TARGET_CORE_VERSION, "--additional-urls", target.index], { stdio: "inherit" });'

      - name: "🧪 Compile each ATmega2560 production profile without device access"
        run: |
          node Tools/Firmware/targets.mjs build mega2560 constrained
          node Tools/Firmware/targets.mjs build mega2560 expanded-panel
          node Tools/Firmware/targets.mjs build mega2560 expanded-autonomous

      - name: "⬆️ Preserve build-only ATmega2560 evidence (not a commissioned release)"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BuildOnly-ATmega2560-Targets
          path: .build/firmware/mega2560
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
