name: "⚡ Firmware · AVR"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version associated with the firmware package
        required: false
        default: ""
        type: string
      showcase_alias:
        description: Also publish the ESP-compatible flat artifact named firmware
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        description: Version associated with the firmware package
        required: false
        default: ""
        type: string
      showcase_alias:
        description: Also publish the ESP-compatible flat artifact named firmware
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ inputs.version || github.ref }}
  cancel-in-progress: true

jobs:
  compile-validate-package:
    name: "⚡ AVR Firmware · ATmega328P"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FORCE_COLOR: "1"
      PCCONTROLLER_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}', github.run_number) }}
      TZ: UTC

    steps:
      - name: "📥 Check out exact source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "🟢 Install Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: "📌 Read canonical dependency pins"
        id: pins
        run: node .github/scripts/dependency-report.mjs export

      - name: "🔐 Install checksum-verified Arduino CLI"
        env:
          ARDUINO_CLI_ASSET: ${{ steps.pins.outputs.arduino_cli_asset }}
          ARDUINO_CLI_SHA256: ${{ steps.pins.outputs.arduino_cli_linux_64_sha256 }}
          ARDUINO_CLI_URL: ${{ steps.pins.outputs.arduino_cli_download_url }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$ARDUINO_CLI_ASSET"
          install_dir="$RUNNER_TEMP/arduino-cli/bin"
          curl --fail --location --retry 3 --output "$archive" "$ARDUINO_CLI_URL"
          echo "$ARDUINO_CLI_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" arduino-cli
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/arduino-cli" version

      - name: "🐹 Install Go from go.mod"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: Tools/Controller/go.mod
          cache-dependency-path: Tools/Controller/go.sum

      - name: "🕰️ Freeze reproducible build time"
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: "🧩 Install pinned MiniCore platform"
        env:
          MINICORE_INDEX_URL: ${{ steps.pins.outputs.minicore_index_url }}
          MINICORE_PACKAGE: ${{ steps.pins.outputs.minicore_package }}
          MINICORE_VERSION: ${{ steps.pins.outputs.minicore_version }}
        run: |
          arduino-cli core update-index --additional-urls "$MINICORE_INDEX_URL"
          arduino-cli core install "$MINICORE_PACKAGE@$MINICORE_VERSION" --additional-urls "$MINICORE_INDEX_URL"

      - name: "📻 Install pinned Arduino library"
        env:
          RC_SWITCH_VERSION: ${{ steps.pins.outputs.rc_switch_version }}
        run: arduino-cli lib install "rc-switch@$RC_SWITCH_VERSION"

      - name: "🚀 Build and validate real AVR firmware"
        run: >-
          ./build.sh
          --firmware-only
          --clean
          --version "$PCCONTROLLER_VERSION"

      - name: "🔎 Recheck Intel HEX records and boundaries"
        run: ./firmware.sh check

      - name: "📚 Record declared and resolved dependencies"
        run: |
          arduino-cli version > .build/firmware/dependencies.txt
          arduino-cli core list >> .build/firmware/dependencies.txt
          arduino-cli lib list >> .build/firmware/dependencies.txt
          arduino-cli core list --format json > .build/firmware/resolved-cores.json
          arduino-cli lib list --format json > .build/firmware/resolved-libraries.json
          cp .github/dependencies.json .build/firmware/declared-dependencies.json

      - name: "📦 Create versioned firmware package"
        id: package
        run: >-
          node .github/scripts/package-directory.mjs
          .build/firmware
          PCController-Firmware
          AVR-ATmega328P

      - name: "🎁 Stage a flat ESP-style firmware artifact"
        shell: bash
        env:
          PACKAGE_ARCHIVE: ${{ steps.package.outputs.archive }}
          PACKAGE_CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          set -euo pipefail
          staging=".build/actions-artifact"
          rm -rf "${staging}"
          mkdir -p "${staging}"
          cp "${PACKAGE_ARCHIVE}" "${PACKAGE_CHECKSUM}" "${staging}/"
          find .build/firmware -maxdepth 1 -type f \
            \( -name '*.hex' -o -name '*.eep' -o -name 'firmware-manifest.json' \
               -o -name 'dependencies.txt' -o -name '*-dependencies.json' \
               -o -name 'resolved-*.json' \) \
            -exec cp '{}' "${staging}/" ';'
          test "$(find "${staging}" -maxdepth 1 -type f -name '*.hex' | wc -l)" -eq 2
          test "$(find "${staging}" -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          find "${staging}" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: "⬆️ Upload friendly firmware artifact"
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PCController-Firmware-ATmega328P
          path: .build/actions-artifact/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
          compression-level: 9

      - name: "⚡ Publish ESP-compatible artifact alias · firmware"
        if: ${{ inputs.showcase_alias }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware
          path: .build/actions-artifact/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
          compression-level: 9

      - name: "✨ Publish ASA-inspired AVR build story"
        if: always() && steps.upload.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          PCCONTROLLER_SHOWCASE_ALIAS: ${{ inputs.showcase_alias }}
        run: >-
          node .github/scripts/step-summary.mjs
          firmware
          .build/firmware/firmware-manifest.json
          "${{ steps.package.outputs.archive }}"
          "$ARTIFACT_URL"
          "$ARTIFACT_DIGEST"
          .github/dependencies.json
          "${{ steps.package.outputs.package-root }}"
