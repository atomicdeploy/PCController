name: Hardware validation result
description: Record a controlled physical-board test with reproducible evidence.
title: "hardware: "
labels: []
body:
  - type: input
    id: firmware
    attributes:
      label: Firmware identity
      description: Use the firmware hash and packed timestamp reported by the running device.
      placeholder: Hash and YYMMDDHHMMSS timestamp
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device identity
      placeholder: Board, COM port, VID/PID, friendly name
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Wiring and initial safe state
      description: Include supply, programmer/bootloader path, door/BT state, and initial relay/PWM/illumination values.
    validations:
      required: true

  - type: textarea
    id: procedure
    attributes:
      label: Test procedure
      placeholder: Numbered steps, including commands and physical interactions.
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Result and evidence
      description: Record pass/fail per step, telemetry, reset count/cause, visible output, and attached evidence.
    validations:
      required: true

  - type: checkboxes
    id: restored
    attributes:
      label: Safe handoff
      options:
        - label: Relays, motion, user PWM, and illumination were returned to the intended safe state.
          required: true
        - label: Temporary silence, debug, or reset behavior was restored to the requested configuration.
          required: true
