version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - github-actions
    groups:
      actions-compatible:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /Tools/Controller
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - go
    groups:
      go-compatible:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /Tools/Controller/web
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - web
    groups:
      web-compatible:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /Tools/Build
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - build
    groups:
      build-compatible:
        patterns: ["*"]
