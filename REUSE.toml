version = 1
SPDX-PackageName = "PCController"
SPDX-PackageSupplier = "David Refoua and PCController contributors"
SPDX-PackageDownloadLocation = "https://github.com/atomicdeploy/PCController"

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 David Refoua and PCController contributors"
SPDX-License-Identifier = "MIT OR BSD-2-Clause"

[[annotations]]
path = ["Project/AddressableLeds.cpp"]
precedence = "override"
SPDX-FileCopyrightText = [
  "Adafruit Industries and Adafruit NeoPixel contributors",
  "2026 David Refoua and PCController contributors",
]
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = ["LocalLib/DallasTemperatureBus.cpp"]
precedence = "override"
SPDX-FileCopyrightText = [
  "2000 Dallas Semiconductor Corporation",
  "2007 Jim Studt and OneWire contributors",
  "2026 David Refoua and PCController contributors",
]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["Tools/Controller/web/src/assets/vazirmatn.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2015 The Vazirmatn Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["mobile/assets/fonts/Vazirmatn-Regular.ttf", "mobile/assets/fonts/Vazirmatn-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2015 The Vazirmatn Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["mobile/assets/fonts/Phosphor.ttf", "mobile/assets/fonts/Phosphor-LICENSE.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2020-2021 Phosphor Icons"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["mobile/lib/**", "mobile/android/**", "mobile/test/**", "mobile/PAKAR-LICENSE", "mobile/PAKAR-README.md", "mobile/lib/application_artwork.dart"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 AtomicDeploy contributors", "2026 David Refoua and PCController contributors"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["mobile/assets/branding/pealayer.png", "mobile/PEALAYER-LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "2026 ToghrolTP"
SPDX-License-Identifier = "MIT"
