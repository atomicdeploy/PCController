<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>PCController API Reference</title><link rel="icon" href="assets/icon.svg"><link rel="stylesheet" href="assets/explorer.css"></head><body><header class="topbar"><a class="identity" href="reference.html"><img src="assets/icon.svg" alt="" width="32" height="32"><strong>PCController</strong><span>API explorer</span></a><nav aria-label="API protocols"><a href="reference.html">HTTP</a><a href="rpc.html">JSON-RPC</a><a href="protocols.html">WebSocket &amp; events</a><a href="openapi.json" download>OpenAPI ↗</a><a href="jsonrpc.schema.json" download>RPC schema ↗</a><a href="asyncapi.json" download>AsyncAPI ↗</a></nav></header><h1 class="sr-only">PCController API</h1><div id="app"></div><script id="pccontroller-openapi" type="application/json">{"openapi":"3.1.0","info":{"title":"PCController HTTP API","version":"unversioned","summary":"Unversioned living REST and JSON-RPC surface of the primary controller host.","description":"PCController is the primary owner of a controller board and exposes the same operations to its desktop GUI, TUI (terminal UI), WebUI and remote clients. Start with **GET /api/ui-config**, read **GET /api/snapshot**, and use the [WebSocket guide](protocols.html#websocket) for live changes. Use [JSON-RPC methods](rpc.html) for RF reception/learning, board automation, melodies, lighting, channel routing and other typed features.\n\n### Choose the right operation\nReading a snapshot or catalog does not actuate outputs. Editing presentation or an effect library does not play it. Importing/staging an artifact does not flash it. An asynchronous **202** means a job was queued: retain its operation ID and inspect its progress and terminal state. Never infer physical success solely from HTTP success or repeat a hardware mutation after a lost response.\n\n### Terms and units\n- **Host**: the PCController process on a computer. **Board**: the attached AVR hardware (or explicitly selected virtual board). **Peer**: another reachable application host. **Application instance**: one live GUI/TUI/WebUI surface with a leased identity.\n- **PWM**: pulse-width modulation. Raw output is 0–4095; percent is 0–100 after channel calibration. **RF**: radio-frequency remote control; learning stores a received waveform, assigning binds it to an action. **LCD**: character display; **OSD**: desktop overlay.\n- **DS18B20** measures temperature; **INA219** measures supply voltage/current. Sensor values use declared units; null/unavailable is not zero. A register readback confirms a stored command, not its electrical effect.\n- **SHA-256**: content digest identifying exact artifact bytes. **Build hash**: source/build identity, not necessarily that file digest. **EEPROM**: persistent board settings. A **manifest** lists candidate files and provenance; a **candidate** is not yet verified or installed.\n- **Revision / ETag**: opaque concurrency token. **Compare-and-swap** applies a change only if the supplied revision is current. Host-instance ID and connection generation fence commands against a replaced process or board session. Read these tokens from the selected host rather than manufacturing them.\n- **Idempotency key**: caller identity for one logical job, allowing supported update APIs to find the same job after a transport interruption. It does not make arbitrary hardware commands safe to replay. **Outcome unknown** means the command may already have taken effect.\n- **JSON-RPC**: named requests with correlated IDs and result/error envelopes. **NDJSON**: one JSON object per line over a stream. WebSocket push messages without an ID are notifications, not request responses. **ACK** means acknowledgement; its strength depends on the method (delivery, register readback or target application confirmation).\n\n### Access and transport\nLoopback is the safe default. Application authentication/authorization is disabled in the current alpha; dormant ticket/proof routes return 409. Operating-system, updater, ownership and safety gates still apply. The built-in listener does not terminate TLS: use a trusted deployment boundary for remote access. Examples use the selected origin; no request is executed from this reference. Contracts are unversioned and describe this build. See the [event/transport contract](asyncapi.json) and [RPC catalog](rpc.html) for subscriptions and response envelopes."},"servers":[{"url":"http://127.0.0.1:8787","description":"Default loopback primary"}],"security":[],"paths":{"/api/osd":{"get":{"operationId":"get_api_osd","summary":"Read desktop overlay status","description":"Inspect Windows OSD support, current or retained presentation and its terminal outcome without displaying anything. An optional id reads an exact notification.\n\n**Use case:** Use an exact returned id to observe one script notification without confusing it with a replacement.\n\n**Typed alternative:** [controller.osd.status](rpc.html#controller.osd.status).","tags":["osd"],"x-required-capability":"read","x-idempotency":"safe","responses":{"200":{"description":"supported describes platform availability; active is current visibility. text_renderer identifies DirectWrite or GDI fallback. Action/dismissal outcomes are separate from hardware state.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/OSDStatus"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"405":{"$ref":"#/components/responses/MethodNotAllowed"}},"parameters":[{"in":"query","name":"id","required":false,"schema":{"type":"string","maxLength":64},"description":"Exact active or retained terminal notification identity; omission reads the current presentation."}],"x-use-case":"Use an exact returned id to observe one script notification without confusing it with a replacement.","x-codeSamples":[{"lang":"Shell","label":"Read from this host","source":"curl --request GET '\u003cHOST_ORIGIN\u003e/api/osd'"}]},"post":{"operationId":"post_api_osd","summary":"Show a desktop overlay","description":"Present a non-activating Windows OSD with title/body/icon, optional actions, lifetime, position and stacking/replacement policy. Action URIs run only after human activation.\n\n**Use case:** Show a script’s completion summary without stealing focus; enable sound/taskbar flash only when wanted.\n\n**Typed alternative:** [controller.osd.show](rpc.html#controller.osd.show).","tags":["osd"],"x-required-capability":"messages","x-idempotency":"see operation semantics and idempotency keys","responses":{"200":{"description":"Returns presentation status/identity. Accepted display is not action activation; retain id to wait for dismissal/action or to dismiss only that overlay.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/OSDStatus"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"405":{"$ref":"#/components/responses/MethodNotAllowed"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/OSDRequest"},"examples":{"workflow":{"summary":"Example request (replace angle-bracket placeholders)","value":{"title":"Export complete","text":"The verified backup is ready.","icon":"success","duration_ms":5000}}}}}},"x-use-case":"Show a script’s completion summary without stealing focus; enable sound/taskbar flash only when wanted.","x-codeSamples":[{"lang":"Shell","label":"Request template","source":"curl --request POST '\u003cHOST_ORIGIN\u003e/api/osd' --header 'Content-Type: application/json' --data '{\"title\":\"Export complete\",\"text\":\"The verified backup is ready.\",\"icon\":\"success\",\"duration_ms\":5000}'"}]},"delete":{"operationId":"delete_api_osd","summary":"Dismiss a desktop overlay","description":"Request the normal fade-out transition. Supply id to avoid an obsolete script closing a newer replacement notification.\n\n**Use case:** Cancel one script notification by the id returned when it was shown.\n\n**Typed alternative:** [controller.osd.dismiss](rpc.html#controller.osd.dismiss).","tags":["osd"],"x-required-capability":"messages","x-idempotency":"see operation semantics and idempotency keys","responses":{"200":{"description":"Returns updated OSD status; closing the overlay does not execute its action buttons.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/OSDStatus"}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"405":{"$ref":"#/components/responses/MethodNotAllowed"}},"requestBody":{"required":false,"description":"Omit id to dismiss the current presentation; supply id to fence a specific overlay.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/OSDDismiss"}}}},"x-use-case":"Cancel one script notification by the id returned when it was shown."}},"/healthz":{"get":{"operationId":"get_healthz","summary":"Identify the running service","description":"Check that this HTTP process responds and identify its product/service. It does not probe the serial port.\n\n**Use case:** Use before accepting a saved endpoint; then read the snapshot for board connection state.\n\n**Typed alternative:** [controller.ping](rpc.html#controller.ping).","tags":["service"],"x-required-capability":"public","x-idempotency":"safe","responses":{"200":{"description":"ok/status describe service liveness; product/service identify the responding host, not board health.","content":{"application/json":{"schema":{"type":"object","properties":{"ok":{"const":true,"description":"This listener handled the liveness request."},"status":{"const":"ok","description":"HTTP service liveness, not board connection health."},"product":{"const":"pccontroller","description":"Product identity of the responding listener."},"service":{"type":"string","description":"Configured human-readable service identity."}}}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"405":{"$ref":"#/components/responses/MethodNotAllowed"}},"security":[],"x-use-case":"Use before accepting a saved endpoint; then read the snapshot for board connection state.","x-codeSamples":[{"lang":"Shell","label":"Read from this host","source":"curl --request GET '\u003cHOST_ORIGIN\u003e/healthz'"}]}},"/upnp/public.json":{"get":{"operationId":"get_upnp_public_json","summary":"Read the public host directory","description":"Return a bounded non-secret directory used by discovery clients to identify this host and its advertised endpoints.\n\n**Use case:** Verify a discovered service before offering it as a connection target.","tags":["service"],"x-required-capability":"public","x-idempotency":"safe","responses":{"200":{"description":"Host, board and endpoint facts are observations; telemetry availability and health must be checked separately.","content":{"application/json":{"schema":{"type":"object","additionalProperties":true}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"405":{"$ref":"#/components/responses/MethodNotAllowed"}},"security":[],"x-use-case":"Verify a discovered service before offering it as a connection target.","x-codeSamples":[{"lang":"Shell","label":"Read from this host","source":"curl --request GET '\u003cHOST_ORIGIN\u003e/upnp/public.json'"}]}},"/api/ui-config":{"get":{"operationId":"get_api_ui_config","summary":"Discover client transport settings","description":"Read the non-secret browser bootstrap, including the configured WebSocket and Socket.IO paths. Do not assume /ipc is fixed.\n\n**Use case:** Bootstrap a WebUI or external client without storing transport paths in its source.","tags":["ui-config"],"x-required-capability":"public","x-idempotency":"safe","responses":{"200":{"description":"The transport paths refer to this listener; combine them with the selected HTTP origin and choose ws or wss accordingly.","content":{"application/json":{"schema":{"type":"object","additionalProperties":true}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"405":{"$ref":"#/components/responses/MethodNotAllowed"}},"security":[],"x-use-case":"Bootstrap a WebUI or external client without storing transport paths in its source.","x-codeSamples":[{"lang":"Shell","label":"Read from this host","source":"curl --request GET '\u003cHOST_ORIGIN\u003e/api/ui-config'"}]}},"/api/auth/server-proof":{"get":{"operationId":"get_api_auth_server_proof","summary":"Inspect server-proof availability","description":"Reserved challenge-response route for server identity verification. It currently rejects with 409 because application authentication is disabled.\n\n**Use case:** Keep compatibility clients from mistaking a disabled authentication flow for a disconnected board.","tags":["auth"],"x-required-capability":"public","x-idempotency":"safe","responses":{"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"405":{"$ref":"#/components/responses/MethodNotAllowed"},"409":{"description":"Application authentication is disabled in the immediate alpha"}},"security":[],"parameters":[{"name":"X-PCController-Nonce","in":"header","required":true,"schema":{"type":"string","minLength":22,"maxLength":86},"description":"16..64 random bytes encoded as unpadded base64url"}],"x-use-case":"Keep compatibility clients from mistaking a disabled authentication flow for a disconnected board.","x-codeSamples":[{"lang":"Shell","label":"Read from this host","source":"curl --request GET '\u003cHOST_ORIGIN\u003e/api/auth/server-proof'"}]}},"/api/session/ticket":{"post":{"operationId":"post_api_session_ticket","summary":"Inspect session-ticket availability","description":"Reserved one-use transport ticket route. It currently returns 409; no ticket is issued or required in this alpha.\n\n**Use case:** Current clients connect to the bootstrap WebSocket path without requesting a ticket.","tags":["session"],"x-required-capability":"session","x-idempotency":"see operation semantics and idempotency keys","responses":{"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"405":{"$ref":"#/components/responses/MethodNotAllowed"},"409":{"description":"Application authentication is disabled in the immediate alpha"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SessionTicketRequest"}}}},"x-use-case":"Current clients connect to the bootstrap WebSocket path without requesting a ticket."}},"/api/rpc":{"post":{"operationId":"post_api_rpc","summary":"Call a typed controller method","description":"Dispatch one JSON-RPC 2.0 method. The method catalog documents the exact params, capabilities and result semantics for each operation.\n\n**Use case:** For example, call controller.rf.catalog to build an RF manager without parsing CLI text.","tags":["rpc"],"x-required-capability":"dynamic","x-idempotency":"see operation semantics and idempotency keys","responses":{"200":{"description":"Successful JSON-RPC result envelope. The method defines whether this means cached data, accepted work or confirmed readback.","content":{"application/json":{"schema":{"type":"object","required":["jsonrpc","id"],"properties":{"jsonrpc":{"const":"2.0","description":"JSON-RPC protocol marker."},"id":{"$ref":"#/components/schemas/JSONRPCID","description":"Echo
