address":"/ipc","description":"Raw JSON-RPC 2.0 over WebSocket text messages. Requests and notifications share the connection; live streams require controller.subscribe. The path is configurable via websocket_path in /api/ui-config.","messages":{"request":{"$ref":"#/components/messages/JSONRPCRequest"},"response":{"$ref":"#/components/messages/JSONRPCResponse"},"event":{"$ref":"#/components/messages/Event"},"state":{"$ref":"#/components/messages/State"},"debug":{"$ref":"#/components/messages/Debug"},"opcode":{"$ref":"#/components/messages/Opcode"},"status":{"$ref":"#/components/messages/Status"},"error":{"$ref":"#/components/messages/Error"},"snapshot":{"$ref":"#/components/messages/snapshot"},"pwmValues":{"$ref":"#/components/messages/pwmValues"}}},"socketIO":{"address":"/socket.io/?EIO=4\u0026transport=websocket","description":"Bounded Engine.IO v4 / Socket.IO adapter. Long-polling, namespaces, rooms, binary attachments, and acknowledgement callbacks are intentionally unsupported.","messages":{"packet":{"$ref":"#/components/messages/SocketIOPacket"}}}},"operations":{"sendRPC":{"action":"send","channel":{"$ref":"#/channels/rpc"},"messages":[{"$ref":"#/channels/rpc/messages/request"}]},"receiveRPC":{"action":"receive","channel":{"$ref":"#/channels/rpc"},"messages":[{"$ref":"#/channels/rpc/messages/response"},{"$ref":"#/channels/rpc/messages/event"},{"$ref":"#/channels/rpc/messages/state"},{"$ref":"#/channels/rpc/messages/debug"},{"$ref":"#/channels/rpc/messages/opcode"},{"$ref":"#/channels/rpc/messages/status"},{"$ref":"#/channels/rpc/messages/error"},{"$ref":"#/channels/rpc/messages/snapshot"},{"$ref":"#/channels/rpc/messages/pwmValues"}]},"exchangeSocketIO":{"action":"send","channel":{"$ref":"#/channels/socketIO"},"messages":[{"$ref":"#/channels/socketIO/messages/packet"}]}},"components":{"securitySchemes":{"durableHeader":{"type":"httpApiKey","in":"header","name":"Authorization","description":"Bearer credential for non-browser WebSocket and Socket.IO clients."},"browserTicket":{"type":"httpApiKey","in":"header","name":"Sec-WebSocket-Protocol","description":"Browser clients first POST /api/session/ticket with a header credential, then offer pccontroller and pccontroller.ticket.\u003cticket\u003e. The one-use ticket is Origin, peer, transport, and expiry bound; no credential appears in the URL."}},"messages":{"JSONRPCRequest":{"name":"JSON-RPC request","summary":"Client → host. One object per text message; use a unique id to correlate the reply.","payload":{"$ref":"./jsonrpc.schema.json#/$defs/request"},"examples":[{"payload":{"jsonrpc":"2.0","id":1,"method":"controller.subscribe","params":{"topics":["events","state","status"],"interval_ms":200}}}]},"JSONRPCResponse":{"name":"JSON-RPC response","summary":"Host → client. Matches the request id; result and error are alternatives. Notifications may arrive before this reply.","payload":{"oneOf":[{"$ref":"./jsonrpc.schema.json#/$defs/success"},{"$ref":"./jsonrpc.schema.json#/$defs/error"}]},"examples":[{"payload":{"jsonrpc":"2.0","id":3,"result":{"subscribed":false}}},{"payload":{"jsonrpc":"2.0","id":4,"error":{"code":-32602,"message":"unknown subscription topic \"invalid\""}}}]},"Event":{"payload":{"type":"object","required":["jsonrpc","method","params"],"properties":{"jsonrpc":{"const":"2.0"},"method":{"const":"controller.event"},"params":{"type":"object","additionalProperties":true}},"examples":[{"jsonrpc":"2.0","method":"controller.event","params":{"id":42,"kind":"door","state":"open","source":"board"}}]}},"State":{"payload":{"type":"object","required":["jsonrpc","method","params"],"properties":{"jsonrpc":{"const":"2.0"},"method":{"const":"controller.state"},"params":{"type":"object","additionalProperties":true}},"examples":[{"jsonrpc":"2.0","method":"controller.state","params":{"id":43,"kind":"status_led.changed","stream":"state","source":"board"}}]}},"Debug":{"payload":{"type":"object","required":["jsonrpc","method","params"],"properties":{"jsonrpc":{"const":"2.0"},"method":{"const":"controller.debug"},"params":{"type":"object","additionalProperties":true}},"examples":[{"jsonrpc":"2.0","method":"controller.debug","params":{"id":44,"kind":"rx","stream":"debug","source":"board"}}]}},"Opcode":{"payload":{"type":"object","required":["jsonrpc","method","params"],"properties":{"jsonrpc":{"const":"2.0"},"method":{"const":"controller.opcode"},"params":{"type":"object","required":["id","opcode"],"additionalProperties":true}},"examples":[{"jsonrpc":"2.0","method":"controller.opcode","params":{"id":43,"kind":"rx","opcode":225,"payload":"qrs="}}]}},"Status":{"payload":{"type":"object","required":["jsonrpc","method","params"],"properties":{"jsonrpc":{"const":"2.0"},"method":{"const":"controller.status"},"params":{"type":"object","additionalProperties":true}},"examples":[{"jsonrpc":"2.0","method":"controller.status","params":{"uptime_ms":1234}}]}},"Error":{"payload":{"type":"object","required":["jsonrpc","method","params"],"properties":{"jsonrpc":{"const":"2.0"},"method":{"const":"controller.error"},"params":{"type":"object","additionalProperties":true}}}},"SocketIOPacket":{"payload":{"type":"string","description":"Engine.IO v4 text packet carrying subscribe, unsubscribe, message, command, or rpc events."}},"snapshot":{"name":"controller.snapshot","summary":"Complete snapshot sent initially for state subscriptions and after relevant activity/state changes.","payload":{"type":"object","required":["jsonrpc","method","params"],"properties":{"jsonrpc":{"const":"2.0"},"method":{"const":"controller.snapshot"},"params":{"type":"object","additionalProperties":true}}}},"pwmValues":{"name":"controller.pwm.values","summary":"Complete cached PWM values following a pwm.changed event on the state topic, when values are available.","payload":{"type":"object","required":["jsonrpc","method","params"],"properties":{"jsonrpc":{"const":"2.0"},"method":{"const":"controller.pwm.values"},"params":{"type":"object","additionalProperties":true}}}}}},"x-connection-guides":[{"id":"websocket","name":"WebSocket quick start","address":"/ipc","summary":"Full-duplex JSON-RPC requests, replies and live notifications on one WebSocket connection.","sections":[{"title":"Connect","text":"The default endpoint is ws://\u003chost\u003e:\u003cport\u003e/ipc. Read websocket_path from GET /api/ui-config when the host uses a custom path. Use wss:// behind a TLS reverse proxy; the built-in host does not terminate TLS. Immediate-alpha application authentication is disabled. Remote listeners and allowed Origins must still be configured; do not put credentials in URLs."},{"title":"Browser JavaScript · read-only example","text":"Run in the controller application page or your own allowed-origin client, not this non-executing reference page. No hardware commands are sent.","code":"const config = await fetch('/api/ui-config').then(r =\u003e r.json());\nconst url = new URL(config.websocket_path, location.origin);\nurl.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';\nconst socket = new WebSocket(url);\nsocket.addEventListener('message', ({ data }) =\u003e {\n  const message = JSON.parse(data);\n  if ('id' in message) {\n    console.log('reply', message.id, message.result ?? message.error);\n  } else {\n    console.log('notification', message.method, message.params);\n  }\n});\nsocket.addEventListener('open', () =\u003e {\n  socket.send(JSON.stringify({ jsonrpc: '2.0', id: 1,\n    method: 'controller.snapshot', params: {} }));\n  socket.send(JSON.stringify({ jsonrpc: '2.0', id: 2,\n    method: 'controller.subscribe', params: {\n      topics: ['events', 'state', 'status'], interval_ms: 200\n    } }));\n});\n// When finished: send an unsubscribe request, or close the connection.\nfunction stopWatching() {\n  if (socket.readyState === WebSocket.OPEN)\n    socket.send(JSON.stringify({ jsonrpc: '2.0', id: 3,\n      method: 'controller.unsubscribe', params: {} }));\n}\n// socket.close(1000, 'Finished');"},{"title":"Framing and response correlation","text":"Send one JSON-RPC object per text message, not newline-delimited batches or Socket.IO packets. Binary messages are ignored. The inbound message limit is 1 MiB. Give requests unique IDs and match replies by id, not arrival order. Calls without id do not receive replies. Notifications have method/params and no id; they can interleave with replies, including before the subscription acknowledgement. Register your handler first and buffer notifications if your client requires an ACK boundary. All documented RPC methods share this transport and their existing admission rules."},{"title":"Subscription lifecycle","text":"A new connection has no subscriptions. controller.subscribe defaults to events; state also sends an initial controller.snapshot and subsequent snapshot/PWM patches. A new subscription replaces all topics unless preserve is true. controller.unsubscribe removes all topics from this socket. Closing the connection stops its workers. Reconnect explicitly and resubscribe; use after_id only for retained events from the same host instance, and refresh the snapshot on host replacement. Do not automatically replay mutations after disconnect."},{"title":"Subscription parameters","schema":{"type":"object","properties":{"topics":{"type":"array","items":{"enum":["events","state","debug","status","opcodes","telemetry","opcode"]},"description":"Defaults to events, or opcodes when an opcode filter is supplied. telemetry aliases status; opcode aliases opcodes."},"opcodes":{"type":"array","items":{"type":"integer","minimum":1,"maximum":255},"description":"Optional raw-opcode filter; requires the opcodes topic. Zero is reserved."},"interval_ms":{"type":"integer","anyOf":[{"const":0},{"minimum":50,"maximum":60000}],"default":200,"description":"Status cadence only. Omitted/zero selects 200 ms; ignored without status."},"state_interval_ms":{"type":"integer","anyOf":[{"const":0},{"minimum":16,"maximum":1000}],"default":0,"description":"Coalescing budget for high-rate state only; zero delivers immediately. Segment edges remain immediate."},"after_id":{"type":"integer","minimum":0,"description":"Resume retained event streams after this event ID. Omitted/zero starts at the current cursor. IDs are host-instance scoped, not durable across restarts."},"preserve":{"type":"boolean","default":false,"description":"False replaces all subscriptions on this connection. True replaces only the named topics, preserving other workers/cursors."}},"examples":[{"topics":["events","state","status"],"interval_ms":200}]}},{"title":"Topics and notification methods","table":[["events","controller.event; relevant changes can also emit controller.snapshot"],["state","controller.snapshot initially; controller.state, controller.pwm.values and changed snapshots afterward"],["debug","controller.debug (explicit opt-in)"],["status / telemetry","controller.status at interval_ms; controller.error on status read failure"],["opcodes / opcode","controller.opcode, optionally filtered by opcodes"]]}],"methods":["controller.subscribe","controller.unsubscribe","controller.snapshot","controller.status"]},{"id":"socketio","name":"Socket.IO framing","address":"/socket.io/?EIO=4\u0026transport=websocket","summary":"Bounded Engine.IO v4 / Socket.IO WebSocket adapter. It is not the raw JSON-RPC /ipc endpoint.","sections":[{"title":"Handshake and heartbeat","text":"Connect using transport=websocket and EIO=4. The server sends 0{...} with sid, upgrades, pingInterval, pingTimeout and maxPayload. Send 40; the server replies 40{\"sid\":...}. Answer server text ping 2 with text pong 3 (the advertised ping interval is 25 seconds). A compatible Socket.IO client handles framing and heartbeat; disable polling fallback. Send 41 or close the WebSocket to disconnect."},{"title":"Subscribe · client → server","code":"42[\"subscribe\",{\"topics\":[\"events\",\"state\",\"status\"],\"interval_ms\":200}]"},{"title":"Read-only RPC · client → server","code":"42[\"rpc\",{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"controller.snapshot\",\"params\":{}}]"},{"title":"Replies and events","text":"Events are 42[name,payload]. subscribe replies with subscribed; unsubscribe with unsubscribed. rpc replies with rpc.response carrying the JSON-RPC envelope. Controller notifications carry the notification method as event name and params as payload. message and command have message.accepted and command.response replies; their normal authorization and hardware admission still apply. Unsupported events produce error."},{"title":"Unsubscribe · client → server","code":"42[\"unsubscribe\",{}]"},{"title":"Supported subset","text":"WebSocket only: no long-polling, custom namespaces, rooms, binary attachments or acknowledgement callbacks. Use the raw /ipc endpoint if you do not need Socket.IO framing."}]}],"x-socket-io-events":{"incoming":["subscribe","unsubscribe","message","command","rpc"],"outgoing":["subscribed","unsubscribed","message.accepted","command.response","rpc.response","controller.event","controller.state","controller.debug","controller.opcode","controller.status","controller.error","error","controller.snapshot","controller.pwm.values"]}}</script><script id="rpc-contract" type="application/json">{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"https://pccontroller.local/schemas/jsonrpc.json","title":"PCController JSON-RPC 2.0","oneOf":[{"$ref":"#/$defs/request"},{"$ref":"#/$defs/success"},{"$ref":"#/$defs/error"},{"$ref":"#/$defs/notification"}],"$defs":{"OSDEmpty":{"type":"object","additionalProperties":false,"properties":{}},"OSDDismiss":{"type":"object","additionalProperties":false,"properties":{"id":{"type":"string","maxLength":64,"description":"Exact active OSD identity; omission dismisses whichever overlay is current."}}},"OSDAction":{"type":"object","required":["label"],"anyOf":[{"required":["id"]},{"required":["uri"]}],"additionalProperties":false,"properties":{"id":{"type":"string","minLength":1,"maxLength":64,"pattern":"^[^\\s]+$","description":"Unique choic
