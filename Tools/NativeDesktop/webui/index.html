<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b1724" />
    <meta name="application-name" content="PCController" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="PCController" />
    <meta name="format-detection" content="telephone=no" />
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="./locale-font.css" />
    <meta name="description" content="Private local control surface for PCController" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./icons/app-180.png"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="./src/assets/favicon-connecting.svg"
      data-pccontroller-desktop-favicon
      data-device-state="connecting"
    />
    <title>PCController</title>
  </head>
  <body>
    <div id="app">
      <noscript>PCController requires JavaScript for its local dashboard.</noscript>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
