    <rect x="21" y="22" width="128" height="48" rx="14" fill="#a78bfa" fill-opacity="0.12"/>
    <path d="M38 54 L61 44 L81 51 L104 34 L131 42" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="21" y="84" width="60" height="42" rx="12" fill="#fb7185" fill-opacity="0.14"/>
    <rect x="89" y="84" width="60" height="42" rx="12" fill="#fbbf24" fill-opacity="0.13"/>
    <rect x="21" y="140" width="128" height="39" rx="12" fill="#ffffff" fill-opacity="0.07"/>
    <path d="M37 160 H84" stroke="#f8f4ff" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
    <path d="M107 160 H133" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
