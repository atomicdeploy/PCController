<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">PCController — Unified hardware and integration control center</title>
  <desc id="desc">A violet, coral and amber product banner with a controller mark, telemetry trace and control cards.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15121d"/>
      <stop offset="0.55" stop-color="#21172d"/>
      <stop offset="1" stop-color="#17131b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.52" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#050408" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="32" fill="url(#surface)"/>
  <path d="M0 282 L1200 218 L1200 360 L0 360 Z" fill="#ffffff" opacity="0.025"/>
  <path d="M725 0 L1200 0 L1200 360 L922 360 Z" fill="#ffffff" opacity="0.018"/>

  <g transform="translate(72 68)" filter="url(#soft-shadow)">
    <rect width="214" height="214" rx="48" fill="#0e0c13" stroke="#ffffff" stroke-opacity="0.12"/>
    <path d="M54 66 L88 42 H134 L160 66 V148 L132 172 H84 L54 148 Z" fill="none" stroke="url(#brand)" stroke-width="13" stroke-linejoin="round"/>
    <path d="M89 85 H125 L142 104 V126 L123 145 H89 L72 126 V104 Z" fill="url(#brand)" opacity="0.2"/>
    <path d="M93 94 H121 L132 105 V124 L120 136 H94 L82 124 V106 Z" fill="#f7f3ff"/>
    <path d="M45 101 H68 M45 128 H68 M146 101 H169 M146 128 H169 M94 34 V55 M121 34 V55 M94 159 V180 M121 159 V180" stroke="#d8c9ff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(336 80)" fill="#f8f4ff">
    <text x="0" y="52" font-family="Inter, Segoe UI, sans-serif" font-size="58" font-weight="760" letter-spacing="-2">PCController</text>
    <text x="2" y="94" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="650" letter-spacing="3.6" fill="#c4b5fd">CONTROL CENTER</text>
    <text x="2" y="139" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="450" fill="#d4cfda">Firmware, native host and WebUI in one coherent system.</text>
  </g>

  <g transform="translate(338 246)">
    <path d="M0 22 H54 L72 5 L96 39 L123 15 L145 27 H201 L221 10 L248 32 L277 22 H375" fill="none" stroke="url(#trace)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M405 7 H493" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <rect x="405" y="20" width="88" height="29" rx="10" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="449" y="40" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#ddd6fe">FULL DUPLEX</text>
    <rect x="507" y="20" width="75" height="29" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.4"/>
    <text x="544.5" y="40" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#fde68a">RTL · LTR</text>
  </g>

  <g transform="translate(965 73)" filter="url(#soft-shadow)">
    <rect width="170" height="200" rx="24" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="21" y="22" width="128" height="48" rx="14" fill="#a78bfa" fill-opacity="0.12"/>
    <path d="M38 54 L61 44 L81 51 L104 34 L131 42" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="21" y="84" width="60" height="42" rx="12" fill="#fb7185" fill-opacity="0.14"/>
    <rect x="89" y="84" width="60" height="42" rx="12" fill="#fbbf24" fill-opacity="0.13"/>
    <rect x="21" y="140" width="128" height="39" rx="12" fill="#ffffff" fill-opacity="0.07"/>
    <path d="M37 160 H84" stroke="#f8f4ff" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
    <path d="M107 160 H133" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  </g>
